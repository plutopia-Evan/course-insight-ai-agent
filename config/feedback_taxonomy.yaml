version: "1.0"

sentiments:
  - positive
  - negative
  - suggestion
  - neutral

categories:
  课程内容:
    - 内容实用
    - 内容丰富
    - 内容重复
    - 内容太浅
    - 内容太难
    - 内容结构不清晰
    - 内容过时
    - 希望增加相关内容

  讲师表现:
    - 讲解清晰
    - 专业度高
    - 答疑充分
    - 互动充分
    - 互动不足
    - 表达不清晰
    - 答疑不足

  课程节奏:
    - 节奏合理
    - 节奏过快
    - 节奏过慢
    - 前后节奏不均衡
    - 时间安排不合理

  课程难度:
    - 难度适中
    - 难度过高
    - 难度过低
    - 基础要求不明确

  实操与案例:
    - 案例实用
    - 案例不足
    - 案例过时
    - 练习充分
    - 练习不足
    - 希望增加真实案例
    - 希望增加完整案例
    - 希望增加课堂练习

  教材与资料:
    - 资料完整
    - 资料不足
    - 资料发放及时
    - 资料发放较晚
    - 希望增加课后资料
    - 希望提供参考答案

  平台与设备:
    - 平台运行正常
    - 平台卡顿
    - 环境配置困难
    - 软件安装问题
    - 音频问题
    - 视频问题
    - 网络问题

  服务与组织:
    - 服务及时
    - 通知及时
    - 通知不及时
    - 答疑安排充分
    - 答疑安排不足
    - 组织流程混乱

  时间安排:
    - 上课时间合理
    - 上课时间不合理
    - 单次课时过长
    - 单次课时过短
    - 休息时间不足

  其他:
    - 其他正向评价
    - 其他问题
    - 其他建议
